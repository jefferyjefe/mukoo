plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mukoo.logger'
    // android-36.1 is the installed base sdk for api 36 (pixel 7a runs this fine)
    compileSdk 36

    defaultConfig {
        applicationId "com.mukoo.logger"
        // pixel 7a shipped on android 13 (api 33)
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName "0.1"

        // where the phone posts batches. defaults to localhost so a usb-tethered
        // bench test works with `adb reverse tcp:8000 tcp:8000`; for a real drive
        // pass the mac's lan ip, e.g. -PMUKOO_BASE_URL=http://192.168.1.20:8000
        buildConfigField "String", "MUKOO_BASE_URL",
                "\"${project.findProperty('MUKOO_BASE_URL') ?: 'http://127.0.0.1:8000'}\""
    }

    buildFeatures {
        // we read the base url off BuildConfig
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// no dependencies on purpose: telephony, location, sqlite, org.json and
// HttpURLConnection are all in the platform. nothing to resolve, nothing to
// break, and a tiny apk for a field tool.
dependencies {
}
