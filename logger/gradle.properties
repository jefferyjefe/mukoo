# jvm heap for the gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# The logger core is platform-only, but the map view uses osmdroid (OpenStreetMap,
# no paid API keys) and osmdroid is published against AndroidX, so AndroidX is on.
# We still don't use appcompat/material — the app theme stays a platform theme.
android.useAndroidX=true
org.gradle.caching=true
