# jvm heap for the gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Build with Android Studio's bundled JDK 21: Gradle 8.14's Groovy cannot parse
# class files from the system's newer JDK (25 -> "unsupported class file major
# version 69"), and JBR 21 is what Studio itself uses for this project anyway.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
# The logger core is platform-only, but the map view uses osmdroid (OpenStreetMap,
# no paid API keys) and osmdroid is published against AndroidX, so AndroidX is on.
# We still don't use appcompat/material — the app theme stays a platform theme.
android.useAndroidX=true
org.gradle.caching=true
