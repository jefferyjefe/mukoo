# Alembic configuration for Mukoo.
#
# The database URL is read from the DATABASE_URL environment variable at
# runtime (see migrations/env.py). The placeholder below is never a working
# connection on purpose: a real URL here would be the file a credential
# eventually gets committed into, and a fallback that silently connects
# somewhere is worse than one that fails loudly. Set DATABASE_URL instead:
#
#   DATABASE_URL=postgresql+psycopg2://user:pass@localhost:5432/mukoo \
#     alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
