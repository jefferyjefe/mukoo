[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mukoo-model"
version = "0.1.0"
description = "Mukoo coverage model — kriging / RF propagation over ingested measurements"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  # Numerics + geostatistics.
  "numpy>=1.24,<2",
  "scipy>=1.10",
  "PyKrige>=1.7",          # ordinary kriging with per-point variance
  # Read points from PostGIS (same stack as the ingest package).
  "SQLAlchemy>=2.0,<3",
  "GeoAlchemy2>=0.14",
  "psycopg2-binary>=2.9",
  # Project lon/lat -> metric UTM so variograms are in metres, and write rasters.
  "pyproj>=3.4",
  "rasterio>=1.3",         # GeoTIFF export (bundles GDAL)
  # Active-learning route suggestions: road geometry + nearest-road snapping.
  "shapely>=2.0",          # geometry ops + STRtree nearest-road queries
  "osmnx>=1.9",            # fetch the drivable road network from OpenStreetMap
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]
# Render the README coverage-vs-claim map (docs/make_coverage_map.py). geopandas
# already arrives transitively via osmnx; matplotlib is the only addition.
viz = [
  "matplotlib>=3.6",
]

[project.scripts]
mukoo-krige = "mukoo_model.cli:main"
mukoo-suggest = "mukoo_model.cli_suggest:main"
mukoo-refresh = "mukoo_model.refresh:main"
mukoo-claims = "mukoo_model.cli_claims:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
